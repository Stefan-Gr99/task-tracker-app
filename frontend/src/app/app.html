<h1 class="title">Task Tracker</h1>

<mat-card class="border-newTsk">

    <h2>Neuen Task erstellen</h2>

    <mat-form-field>
        <mat-label>Titel</mat-label>
        <input matInput [(ngModel)]="newTitle">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="newStatus">
            <mat-option value="NICHT_ANGEFANGEN">Nicht angefangen</mat-option>
            <mat-option value="IN_ARBEIT">In Arbeit</mat-option>
            <mat-option value="FERTIG">Fertig</mat-option>
        </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" [disabled]="!newTitle" (click)="addTask()">
        Task erstellen
    </button>

</mat-card>


<div class="row">

    <mat-card>

        <h2>Task anzeigen</h2>

        <mat-form-field>
            <mat-label>TaskID</mat-label>
            <input matInput [(ngModel)]="taskId" required type="number">
        </mat-form-field>


        <button mat-raised-button color="primary" type="button" (click)="ladeTask(taskId)" [disabled]="taskId === null">
            Task laden
        </button>

        <p *ngIf="taskAusgabe()">
            {{ taskAusgabe()?.title }} - {{ taskAusgabe()?.status }}
        </p>
    </mat-card>

    <mat-card>
        <h2>Tasks löschen</h2>

        <mat-form-field>
            <mat-label>TaskID</mat-label>
            <input matInput [(ngModel)]="deleteTaskId" required type="number">
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="deleteTask(deleteTaskId)" [disabled]="deleteTaskId === null">
            Task löschen
        </button>

    </mat-card>

</div>

<mat-card>

    <h2>Alle Tasks anzeigen</h2>

    <button mat-raised-button color="primary" (click)="ladeAlleTask()">
        Tasks laden
    </button>

    <li *ngFor="let task of tasks()" class="task-item">

        <div class="task-left">
            <span class="task-id">{{ task.id }}</span>
            <span class="task-title">{{ task.title }}</span>
        </div>

        <span class="task-status" [ngClass]="'status-' + task.status">
            {{ task.status }}
        </span>

        <button mat-icon-button (click)="deleteTask(task.id)">
            <mat-icon>delete</mat-icon>
        </button>

    </li>

</mat-card>
