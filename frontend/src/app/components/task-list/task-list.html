<mat-card class="task-card">

  <div class="task-header">
    <h2>Alle Tasks</h2>
    <button mat-flat-button color="primary" (click)="ladeAlleTask()">
      <mat-icon>refresh</mat-icon> Tasks laden
    </button>
  </div>

  <div class="empty-state" *ngIf="sortedTasks().length === 0">
    <mat-icon>inbox</mat-icon>
    <p>Keine Aufgaben vorhanden</p>
  </div>

  <ul class="task-list">
    <li *ngFor="let task of sortedTasks()" class="task-item"
        [ngClass]="'border-' + task.status">

      <div class="task-left">
        <span class="task-id">#{{ task.id }}</span>
        <span class="task-title" [class.done]="task.status === 'FERTIG'">
          {{ task.title }}
        </span>
      </div>

      <mat-select class="status-dropdown" [ngModel]="task.status"
                  (ngModelChange)="updateStatus(task, $event)">
        <mat-select-trigger>
          <span class="task-status" [ngClass]="'status-' + task.status">
            {{ statusLabel(task.status) }}
          </span>
        </mat-select-trigger>
        <mat-option value="NICHT_ANGEFANGEN">Nicht angefangen</mat-option>
        <mat-option value="IN_ARBEIT">In Arbeit</mat-option>
        <mat-option value="FERTIG">Fertig</mat-option>
      </mat-select>

      <div class="task-actions">
        <button mat-icon-button color="primary" (click)="editTask(task)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button class="delete" (click)="deleteTask(task)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>

    </li>
  </ul>
</mat-card>
