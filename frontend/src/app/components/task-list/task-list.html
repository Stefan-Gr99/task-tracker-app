<mat-card>

    <h2>Alle Tasks anzeigen</h2>

    <button mat-raised-button color="primary" (click)="ladeAlleTask()">
        Tasks laden
    </button>

    <!-- UI von Liste anpassen -->

    <ul>
        <li *ngFor="let task of service.tasks()" class="task-item">

            <div class="task-left">
                <span class="task-id">{{ task.id }}</span>
                <span class="task-title">{{ task.title }}</span>
            </div>

            <mat-select class="status-dropdown" [ngModel]="task.status" (ngModelChange)="updateStatus(task, $event)">

                <mat-select-trigger>
                    <span class="task-status" [ngClass]="'status-' + task.status">
                        {{ task.status }}
                    </span>
                </mat-select-trigger>

                <mat-option value="NICHT_ANGEFANGEN">Nicht angefangen</mat-option>
                <mat-option value="IN_ARBEIT">In Arbeit</mat-option>
                <mat-option value="FERTIG">Fertig</mat-option>

            </mat-select>

            <button mat-icon-button color="primary">
                <mat-icon>edit</mat-icon>
            </button>

            <button class="delete" mat-icon-button (click)="deleteTask(task)">
                <mat-icon>delete</mat-icon>
            </button>

        </li>
    </ul>

</mat-card>
